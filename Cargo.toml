[package]
name = "interjections"
version = "0.1.0"
edition = "2021"
description = "Stream-of-thought voice interaction with DeepSeek V4 Flash"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
nnnoiseless = "0.5"
sherpa-onnx = "1.13"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
rustls = "0.23"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
pocket-tts = "0.6.2"
candle-core = "=0.9.2"
async-trait = "0.1"
